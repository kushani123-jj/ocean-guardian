api:
  global_fishing_watch: "https://globalfishingwatch.org/api/v1"
  google_earth_engine: "https://earthengine.googleapis.com"
  noaa: "https://api.noaa.gov"
  open_meteo: "https://marine-api.open-meteo.com/v1"
  obis: "https://api.obis.org"

keys:
  gee_private_key: "your-key.json"   # service account key
  noaa_token: "your-token"

model_params:
  isolation_forest:
    contamination: 0.05
    n_estimators: 100
  lstm:
    sequence_length: 30
    epochs: 50
  random_forest:
    n_estimators: 100
    max_depth: 10